[package]
name = "a3s-science-registry-builder"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "a3s-science-registry-builder"

[dependencies]
a3s-use-extension = "=0.1.3"
anyhow = "1"
flate2 = "1"
olpc-cjson = "0.1"
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
